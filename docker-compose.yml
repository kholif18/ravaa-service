services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ravaa
      POSTGRES_PASSWORD: ravaa_dev_password
      POSTGRES_DB: ravaa_service
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ravaa"]
      interval: 5s

  api:
    build: .
    restart: unless-stopped
    ports:
      - "2711:2711"
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      PORT: 2711
      DATABASE_URL: postgresql://ravaa:ravaa_dev_password@db:5432/ravaa_service
    volumes:
      - ./prisma:/app/prisma:ro

volumes:
  pgdata:
