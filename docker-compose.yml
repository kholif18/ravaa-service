services:
  db:
    image: postgres:16-alpine
    container_name: ravaa-service-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ravaa_service
      POSTGRES_USER: ravaa
      POSTGRES_PASSWORD: ravaa_dev_password
    ports:
      - "5432:5432"
    volumes:
      - ravaa_service_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ravaa -d ravaa_service"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  ravaa_service_db:
    name: ravaa_service_db
